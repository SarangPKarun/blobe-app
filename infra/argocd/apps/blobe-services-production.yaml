apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blobe-services-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://github.com/SarangPKarun/blobeNative
    targetRevision: HEAD
    path: infra/helm/charts/blobe-services
    helm:
      valueFiles:
        - ../../../../infra/helm/values/us-east-1.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: blobe
  # No automated sync — production promotion is triggered manually via cd-production.yml
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
