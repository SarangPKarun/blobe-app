apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blobe-app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SarangPKarun/blobeNative
    targetRevision: HEAD
    path: infra/argocd/apps
    directory:
      recurse: false
      include: "*.yaml"
      exclude: "app-of-apps.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
