apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

---
# ExternalSecret for RDS URL
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: blobe-rds-url
  namespace: blobe
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: blobe-rds-url
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: blobe/production/rds/url

