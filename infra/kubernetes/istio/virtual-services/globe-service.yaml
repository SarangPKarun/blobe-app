apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: globe-service
  namespace: blobe
spec:
  hosts:
    - globe-service.blobe.svc.cluster.local
  http:
    - match:
        - headers:
            upgrade:
              exact: websocket
      route:
        - destination:
            host: globe-service.blobe.svc.cluster.local
            port:
              number: 3004
      timeout: 300s
      retries:
        attempts: 0
    - route:
        - destination:
            host: globe-service.blobe.svc.cluster.local
            port:
              number: 3004
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 3s
        retryOn: gateway-error,connect-failure,retriable-4xx
