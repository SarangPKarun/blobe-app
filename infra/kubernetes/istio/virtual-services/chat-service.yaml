apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: chat-service
  namespace: blobe
spec:
  hosts:
    - chat-service.blobe.svc.cluster.local
  http:
    - match:
        - headers:
            upgrade:
              exact: websocket
      route:
        - destination:
            host: chat-service.blobe.svc.cluster.local
            port:
              number: 3005
      timeout: 600s
      retries:
        attempts: 0
    - route:
        - destination:
            host: chat-service.blobe.svc.cluster.local
            port:
              number: 3005
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,retriable-4xx
