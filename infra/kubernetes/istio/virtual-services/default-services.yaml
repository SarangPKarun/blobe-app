---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: user-service
  namespace: blobe
spec:
  hosts:
    - user-service.blobe.svc.cluster.local
  http:
    - route:
        - destination:
            host: user-service.blobe.svc.cluster.local
            port:
              number: 3001
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 3s
        retryOn: gateway-error,connect-failure,retriable-4xx
