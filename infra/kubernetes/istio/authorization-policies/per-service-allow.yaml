# Istio AuthorizationPolicy — per-service allow rules
# Namespace: blobe
# All policies use mTLS peer authentication; principals are SPIFFE workload identities.

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-user-service
  namespace: blobe
spec:
  selector:
    matchLabels: { app: user-service }
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/blobe/sa/kong-gateway
              - cluster.local/ns/blobe/sa/notification-service
              - cluster.local/ns/monitoring/sa/prometheus-server
---
