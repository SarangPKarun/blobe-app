apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-blobe-globe
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  blobe-globe.json: |
    {
      "title": "Blobe — Globe Service",
      "uid": "blobe-globe",
      "schemaVersion": 39,
      "refresh": "15s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Active WebSocket Connections",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [
            {"expr": "globe_ws_connections_total", "legendFormat": "connections"}
          ],
          "fieldConfig": {
            "defaults": {"unit": "short", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1000}, {"color": "red", "value": 5000}]}}
          }
        },
        {
          "id": 2,
          "title": "WebSocket Disconnection Rate (per min)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 6, "y": 0},
          "targets": [
            {"expr": "rate(globe_ws_disconnections_total[5m]) * 60", "legendFormat": "disconnects/min"}
          ],
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "id": 3,
          "title": "WebSocket Connections Over Time",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [
            {"expr": "globe_ws_connections_total", "legendFormat": "connections"}
          ],
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "id": 4,
          "title": "Kafka Consumer Lag",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [
            {"expr": "globe_kafka_consumer_lag", "legendFormat": "lag {{topic}}"}
          ],
          "fieldConfig": {
            "defaults": {"unit": "short", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 100}, {"color": "red", "value": 1000}]}}
          }
        },
        {
          "id": 5,
          "title": "Kafka Messages Processed (per min)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {"expr": "rate(globe_kafka_messages_processed_total[5m]) * 60", "legendFormat": "msgs/min {{topic}}"}
          ],
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "id": 6,
          "title": "Globe p99 Latency (ms)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", destination_service_namespace=\"blobe\", destination_service_name=\"globe-service\"}[5m])) by (le))",
              "legendFormat": "p99"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", destination_service_namespace=\"blobe\", destination_service_name=\"globe-service\"}[5m])) by (le))",
              "legendFormat": "p50"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "ms"}}
        }
      ]
    }
