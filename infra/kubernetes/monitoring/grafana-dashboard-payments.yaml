apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-blobe-payments
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  blobe-payments.json: |
    {
      "title": "Blobe — Payment Service",
      "uid": "blobe-payments",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Payment Error Rate (%)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\", destination_service_namespace=\"blobe\", destination_service_name=\"payment-service\", response_code=~\"5.*\"}[5m])) / sum(rate(istio_requests_total{reporter=\"destination\", destination_service_namespace=\"blobe\", destination_service_name=\"payment-service\"}[5m])) * 100",
              "legendFormat": "error%"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "percent", "decimals": 3, "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.1}]}}
          }
        },
        {
          "id": 2,
          "title": "Payment Error Rate Over Time",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 6, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\", destination_service_namespace=\"blobe\", destination_service_name=\"payment-service\", response_code=~\"5.*\"}[5m])) / sum(rate(istio_requests_total{reporter=\"destination\", destination_service_namespace=\"blobe\", destination_service_name=\"payment-service\"}[5m])) * 100",
              "legendFormat": "error%"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "percent", "custom": {"lineWidth": 2}, "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.1}]}}
          }
        },
        {
          "id": 3,
          "title": "Payment p99 Latency (ms)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", destination_service_namespace=\"blobe\", destination_service_name=\"payment-service\"}[5m])) by (le))",
              "legendFormat": "p99"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", destination_service_namespace=\"blobe\", destination_service_name=\"payment-service\"}[5m])) by (le))",
              "legendFormat": "p50"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "ms", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 200}, {"color": "red", "value": 400}]}}
          }
        },
        {
          "id": 4,
          "title": "Payment Request Rate (rps)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\", destination_service_namespace=\"blobe\", destination_service_name=\"payment-service\"}[5m]))",
              "legendFormat": "requests/s"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        }
      ]
    }
