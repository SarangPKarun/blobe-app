  serviceAccount:
    roleArn: "arn:aws:iam::ACCOUNT_ID:role/blobe-production-globe-service"
  replicaCount: 3

"search-service":
  image:
    repository: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/blobe/search-service
