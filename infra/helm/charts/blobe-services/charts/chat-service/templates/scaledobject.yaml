apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "chat-service.fullname" . }}
  labels:
    {{- include "chat-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "chat-service.fullname" . }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  pollingInterval: 30
  cooldownPeriod: 120
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 120
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local
        metricName: socketio_connected_clients_per_pod
        threshold: {{ .Values.autoscaling.websocketConnectionsPerPod | quote }}
        query: sum(socketio_connected_clients{service="chat-service"}) / count(up{job="chat-service"})
