apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chat-service.fullname" . }}
  labels:
    {{- include "chat-service.labels" . | nindent 4 }}
data:
  PORT: "3009"
  CORS_ORIGIN: "https://blobe.app"
  SENTRY_ENVIRONMENT: {{ .Values.global.environment | default "production" | quote }}
  SENTRY_RELEASE: {{ .Values.image.tag | default "unknown" | quote }}
