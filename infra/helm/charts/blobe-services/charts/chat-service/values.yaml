replicaCount: 2

image:
  repository: blobe/chat-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 3009
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours - Socket.io long-lived connections

serviceAccount:
  roleArn: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  minReplicas: 2
  maxReplicas: 20
  websocketConnectionsPerPod: "500"
