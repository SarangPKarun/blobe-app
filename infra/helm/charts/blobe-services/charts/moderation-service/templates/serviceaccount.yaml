apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "moderation-service.fullname" . }}
  labels:
    {{- include "moderation-service.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
  {{- end }}
