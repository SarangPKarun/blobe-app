apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moderation-service.fullname" . }}
  labels:
    {{- include "moderation-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "moderation-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "moderation-service.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "moderation-service.fullname" . }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: moderation-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3007
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "moderation-service.fullname" . }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: blobe-db-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: blobe-jwt-secret
                  key: JWT_SECRET
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: blobe-kafka-secret
                  key: KAFKA_BROKER
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: blobe-openai-key
                  key: key
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: blobe-sentry-dsn
                  key: dsn
            - name: SENTRY_ENVIRONMENT
              value: {{ .Values.global.environment | default "production" | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
