apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.global.namespace | default "blobe" }}
data:
  PORT: "3001"
  NODE_ENV: production
  SENTRY_ENVIRONMENT: {{ .Values.global.environment | default "production" | quote }}
  SENTRY_RELEASE: {{ .Values.image.tag | default "unknown" | quote }}
