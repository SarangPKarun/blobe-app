apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.global.namespace | default "blobe" }}
data:
  PORT: "3004"
  ML_ENABLED: {{ .Values.env.ML_ENABLED | quote }}
  ML_BLEND_WEIGHT: {{ .Values.env.ML_BLEND_WEIGHT | quote }}
  SAGEMAKER_TIMEOUT_MS: {{ .Values.env.SAGEMAKER_TIMEOUT_MS | quote }}
  REGION: {{ .Values.global.region | quote }}
