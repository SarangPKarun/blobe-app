image:
  repository: apache/airflow
  tag: "2.9.2-python3.11"

executor: KubernetesExecutor

scheduler:
  replicaCount: 1
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

webserver:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

nodeSelector:
  node-class: ml

tolerations:
  - key: ml-workload
    operator: Equal
    value: "true"
    effect: NoSchedule

serviceAccount:
  roleArn: ""

workerPodTemplate:
  nodeSelector:
    node-class: ml
  tolerations:
    - key: ml-workload
      operator: Equal
      value: "true"
      effect: NoSchedule
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 8Gi
