name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

permissions:
  id-token: write   # OIDC for AWS + Cosign keyless
  contents: read

jobs:
  # ─── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --prefer-offline

      - name: Set Turbo filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TURBO_FILTER=...[origin/${{ github.base_ref }}]..." >> $GITHUB_ENV
          else
            echo "TURBO_FILTER=...[HEAD^1]..." >> $GITHUB_ENV
          fi

      - name: Lint affected packages
        run: npx turbo run lint --filter="${{ env.TURBO_FILTER }}"

  # ─── Test + Coverage Gate ────────────────────────────────────────────────────
  test:
    name: Test + Coverage (affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci --prefer-offline

      - name: Set Turbo filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TURBO_FILTER=...[origin/${{ github.base_ref }}]..." >> $GITHUB_ENV
          else
            echo "TURBO_FILTER=...[HEAD^1]..." >> $GITHUB_ENV
          fi

      - name: Run tests with coverage (Node.js + mobile)
        run: npx turbo run test --filter="${{ env.TURBO_FILTER }}" -- --coverage

      - name: Run Go tests with coverage
        run: |
          for svc in globe-service search-service; do
            dir="services/$svc"
            if [ -d "$dir" ]; then
              cd "$dir"
              go test ./... -coverprofile=coverage.out -covermode=atomic 2>/dev/null || true
              cd - > /dev/null
            fi
          done

      - name: Run Python tests with coverage
        run: |
          pip install pytest pytest-cov --quiet
          for svc in trust-service moderation-service; do
            dir="services/$svc"
            if [ -d "$dir" ] && [ -f "$dir/requirements.txt" ]; then
              pip install -r "$dir/requirements.txt" --quiet 2>/dev/null || true
              cd "$dir"
              python -m pytest --cov=. --cov-report=json --cov-report=term-missing -q 2>/dev/null || true
              cd - > /dev/null
            fi
          done

      - name: Enforce 80% coverage gate
        run: |
          EXIT=0
          echo "=== Coverage Report ==="
          find . -path '*/coverage/coverage-summary.json' -not -path '*/node_modules/*' | while read f; do
            PKG=$(echo "$f" | sed 's|/coverage/coverage-summary.json||' | sed 's|^\./||')
            LINES=$(node -e "
              const s = require('$f');
              const t = s.total;
              if (!t) process.exit(0);
              const pct = t.lines ? t.lines.pct : (t.statements ? t.statements.pct : 100);
              process.stdout.write(String(pct));
            " 2>/dev/null || echo "100")
            echo "  $PKG: ${LINES}%"
            node -e "
              const pct = parseFloat('$LINES');
              if (pct < 80) { console.error('FAIL: $PKG coverage ' + pct + '% < 80%'); process.exit(1); }
            " || EXIT=1
          done
          exit $EXIT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: "**/coverage/**"
          retention-days: 7

  # ─── SAST ────────────────────────────────────────────────────────────────────
  sast:
    name: SAST (Snyk + Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --prefer-offline

      - name: Snyk — dependency vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high --fail-on=all

      - name: Semgrep — SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ─── Build + Push + Sign ─────────────────────────────────────────────────────
  build-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [lint, test, sast]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            context: services/user-service
          - service: post-service
            context: services/post-service
          - service: notification-service
            context: services/notification-service
          - service: globe-service
            context: services/globe-service
          - service: search-service
            context: services/search-service
          - service: trust-service
            context: services/trust-service
          - service: moderation-service
            context: services/moderation-service
          - service: payment-service
            context: services/payment-service
          - service: chat-service
            context: services/chat-service
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/blobe/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/blobe/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          provenance: false

      - name: Sign image (keyless OIDC)
        run: |
          cosign sign --yes \
            "${{ steps.ecr-login.outputs.registry }}/blobe/${{ matrix.service }}@${{ steps.build.outputs.digest }}"
        env:
          COSIGN_EXPERIMENTAL: "1"
