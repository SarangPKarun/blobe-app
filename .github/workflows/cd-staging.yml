name: CD — Staging

on:
  push:
    branches: [main]

concurrency:
  group: cd-staging
  cancel-in-progress: true

permissions:
  contents: write   # push updated staging values

jobs:
  # ─── Update staging image tags in Git (ArgoCD auto-syncs on commit) ──────────
  update-staging-values:
    name: Update staging image tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Stamp SHA into staging values
        run: |
          TAG="${{ github.sha }}"
          for svc in user-service post-service notification-service globe-service \
                     search-service trust-service moderation-service payment-service chat-service; do
            yq e ".[\"${svc}\"].image.tag = \"${TAG}\"" -i infra/helm/values/staging.yaml
          done

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/helm/values/staging.yaml
          git diff --cached --quiet || \
            git commit -m "chore(staging): deploy ${{ github.sha }}" && \
            git push

  # ─── Detox E2E against staging ───────────────────────────────────────────────
  detox-e2e:
    name: Detox E2E — staging
    runs-on: ubuntu-latest
    needs: update-staging-values
    # Give ArgoCD ~90s to sync before we run E2E
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Detox CLI
        run: npm install -g detox-cli

      - name: Enable KVM (Android emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Detox test APK
        working-directory: apps/mobile
        run: detox build -c android.emu.release
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          avd-name: Pixel_4_API_30
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cd apps/mobile && detox test -c android.emu.release --headless --record-logs failing
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: detox-artifacts
          path: apps/mobile/artifacts/
          retention-days: 3
